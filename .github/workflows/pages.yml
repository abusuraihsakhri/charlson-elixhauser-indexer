name: Deploy Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js charlson_elixhauser.py LICENSE _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 --retry-all-errors "${PAGE_URL}" -o /tmp/index.html
          grep -q 'id="analyze-button"' /tmp/index.html
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 --retry-all-errors "${PAGE_URL}app.js" -o /tmp/app.js
          grep -q "loadPyodide" /tmp/app.js
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 --retry-all-errors "${PAGE_URL}charlson_elixhauser.py" -o /tmp/engine.py
          grep -q "def assess_patient" /tmp/engine.py
