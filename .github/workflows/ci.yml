name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Compile Python sources
      run: |
        python -m compileall -q charlson_elixhauser.py cli.py tests

    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v

    - name: Run CLI Batch Smoke Test
      run: |
        python cli.py batch -i sample.csv -o out_smoke.csv

    - name: Run static web smoke test
      run: |
        node --check app.js
        test -s index.html
        test -s app.js
        test -s styles.css
        grep -q "loadPyodide" app.js
        grep -q "charlson_elixhauser.py" app.js
